<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sugutas Prototype</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f7f8;color:#171717}
  .app{max-width:430px;margin:auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
  header{padding:18px 18px 12px;font-weight:800;font-size:24px}
  main{flex:1;padding:0 16px 90px;overflow:auto}
  .add{width:100%;border:0;border-radius:16px;background:#111;color:#fff;padding:16px;font-size:17px;font-weight:700;margin-bottom:18px}
  .today{background:#fff8e8;border-radius:18px;padding:16px;margin-bottom:18px}
  .today h2{margin:0 0 12px;font-size:19px}
  .task{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #eee;font-size:16px;line-height:1.4}
  .task:last-child{border-bottom:0}
  .task input{width:21px;height:21px;margin-top:1px;accent-color:#111}
  .groups{display:grid;gap:10px}
  .group{border:1px solid #e8e8e8;border-radius:16px;overflow:hidden}
  .group button{width:100%;background:#fff;border:0;padding:15px;text-align:left;font-size:16px;font-weight:700;display:flex;justify-content:space-between}
  .count{color:#888;font-weight:600}
  .items{display:none;padding:0 15px 8px}
  .group.open .items{display:block}
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:70px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid #eee;display:grid;grid-template-columns:1fr 1fr 1fr}
  nav button{border:0;background:none;font-size:12px;color:#666}
  nav button.active{color:#111;font-weight:800}
  nav .plus{font-size:24px;color:#111}
  .screen{display:none}
  .screen.active{display:block}
  .back{border:0;background:none;font-size:15px;padding:4px 0 16px}
  textarea{width:100%;height:125px;border:1px solid #ddd;border-radius:14px;padding:14px;font-size:16px;resize:none}
  .counter{text-align:right;color:#888;font-size:12px;margin:5px 4px 18px}
  .choices{display:grid;gap:9px}
  .choice{border:1px solid #ddd;border-radius:13px;padding:13px;background:#fff;font-size:15px}
  .choice.selected{border:2px solid #111;padding:12px;font-weight:700}
  .submit{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:#111;color:#fff;font-size:16px;font-weight:700}
  .history-total{text-align:center;padding:22px 0 18px}
  .history-total strong{display:block;font-size:46px}
  .history-total span{font-size:12px;color:#888;letter-spacing:1px}
  .date{font-weight:800;margin:20px 0 4px}
  .empty{text-align:center;color:#999;padding:40px 10px}
</style>
</head>
<body>
<div class="app">
<header>Sugutas</header>

<main>
  <section id="home" class="screen active">
    <button class="add" onclick="show('add')">＋ すぐタスク追加</button>

    <div class="today">
      <h2>🔥 今日やること</h2>
      <div id="todayList"></div>
    </div>

    <div class="groups" id="groups"></div>
  </section>

  <section id="add" class="screen">
    <button class="back" onclick="show('home')">← 戻る</button>
    <h2>タスク追加</h2>
    <textarea id="text" maxlength="100" placeholder="何をする？"></textarea>
    <div class="counter"><span id="counter">0</span>/100</div>
    <div class="choices" id="choices">
      <button class="choice" data-period="today">🔥 今日</button>
      <button class="choice" data-period="week">📅 今週</button>
      <button class="choice" data-period="month">🗓 今月</button>
      <button class="choice" data-period="year">📆 今年</button>
      <button class="choice" data-period="life">♾ 一生</button>
      <button class="choice selected" data-period="inbox">📥 とりあえず</button>
    </div>
    <button class="submit" onclick="addTask()">追加する</button>
  </section>

  <section id="history" class="screen">
    <h2>🏆 達成履歴</h2>
    <div class="history-total"><strong id="total">0</strong><span>TASKS</span></div>
    <div id="historyList"></div>
  </section>
</main>

<nav>
  <button id="nav-home" class="active" onclick="show('home')">🏠<br>ホーム</button>
  <button onclick="show('add')" class="plus">＋<br><small>追加</small></button>
  <button id="nav-history" onclick="show('history')">🏆<br>履歴</button>
</nav>
</div>

<script>
const labels = {
  inbox:'📥 とりあえず', week:'📅 今週', month:'🗓 今月',
  year:'📆 今年', life:'♾ 一生'
};
let tasks = JSON.parse(localStorage.getItem('sugutas_tasks') || '[]');
let history = JSON.parse(localStorage.getItem('sugutas_history') || '[]');
let selected = 'inbox';

document.getElementById('text').addEventListener('input', e => {
  document.getElementById('counter').textContent = e.target.value.length;
});
document.querySelectorAll('.choice').forEach(b => b.onclick = () => {
  document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected'); selected=b.dataset.period;
});

function todayKey(d=new Date()){
  return d.toISOString().slice(0,10);
}
function monday(d=new Date()){
  const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()-(day===0?6:day-1)); return todayKey(x);
}
function weekKey(){return monday()}
function monthKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function yearKey(d=new Date()){return String(d.getFullYear())}

function addTask(){
  const text=document.getElementById('text').value.trim();
  if(!text){alert('タスクを入力してください');return;}
  tasks.push({id:Date.now(),text,period:selected,created:todayKey(),week:monday(),month:monthKey(),year:yearKey()});
  save(); document.getElementById('text').value=''; document.getElementById('counter').textContent='0';
  selected='inbox'; document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x.dataset.period==='inbox'));
  render(); show('home');
}
function complete(id){
  const i=tasks.findIndex(t=>t.id===id); if(i<0)return;
  const t=tasks.splice(i,1)[0];
  history.unshift({text:t.text,date:todayKey()});
  save(); render();
}
function save(){
  localStorage.setItem('sugutas_tasks',JSON.stringify(tasks));
  localStorage.setItem('sugutas_history',JSON.stringify(history));
}
function render(){
  const today=document.getElementById('todayList');
  const todays=tasks.filter(t=>t.period==='today');
  today.innerHTML=todays.length?todays.map(taskHTML).join(''):'<div class="empty">今日やることはありません</div>';

  const periods=['week','month','year','life','inbox'];
  document.getElementById('groups').innerHTML=periods.map(p=>{
    const arr=tasks.filter(t=>t.period===p);
    return `<div class="group"><button onclick="this.parentElement.classList.toggle('open')">${labels[p]} <span class="count">${arr.length}</span></button><div class="items">${arr.length?arr.map(taskHTML).join(''):'<div class="empty">なし</div>'}</div></div>`;
  }).join('');

  document.getElementById('total').textContent=history.length;
  document.getElementById('historyList').innerHTML=history.length?history.map(h=>`<div class="date">${h.date}</div><div class="task">✓ <span>${escapeHtml(h.text)}<br><small style="color:#888">達成：${h.date}</small></span></div>`).join(''):'<div class="empty">まだ達成履歴はありません</div>';
}
function taskHTML(t){
  return `<label class="task"><input type="checkbox" onchange="complete(${t.id})"><span>${escapeHtml(t.text)}</span></label>`;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('nav-home').classList.toggle('active',id==='home');
  document.getElementById('nav-history').classList.toggle('active',id==='history');
  render();
}
render();
</script>
</body>
</html>
